<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusClub | Locação de Espaços e Eventos em Londrina – PR</title>
    <style>
        :root {
            --bg-dark: #0b132b;
            --bg-card: #1c2541;
            --border-subtle: #2b3861;
            --accent: #f97316;
            --accent-hover: #fb923c;
            --text-light: #f8fafc;
            --text-muted: #cbd5e1;
            --whatsapp: #25D366;
            --whatsapp-hover: #20b858;
            --instagram: #E1306C;
            --instagram-hover: #c1255b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: rgba(11, 19, 43, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .logo span {
            color: var(--accent);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Banner Principal (Hero) */
        .hero {
            position: relative;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 5%;
            background: linear-gradient(rgba(11, 19, 43, 0.74), rgba(11, 19, 43, 0.92)),
                        url('749356989_18009176381930112_7593007302439547902_n.jpg') center/cover no-repeat;
        }

        .hero-content {
            max-width: 800px;
        }

        .badge {
            display: inline-block;
            background-color: rgba(249, 115, 22, 0.16);
            color: var(--accent-hover);
            border: 1px solid var(--accent);
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.15;
            margin-bottom: 1rem;
            color: var(--text-light);
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--whatsapp);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.95rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.25);
            transition: transform 0.2s, background-color 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-2px);
        }

        /* Seções Gerais */
        section {
            padding: 5rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .section-title p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Tamanhos de Eventos */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            color: var(--accent);
            font-size: 1.35rem;
            margin-bottom: 0.8rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        /* Galeria dos Espaços */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: transform 0.3s, border-color 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .gallery-caption {
            padding: 1.2rem;
        }

        .gallery-caption h4 {
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
            color: var(--accent-hover);
        }

        .gallery-caption p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Serviços */
        .services-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .service-box {
            background-color: var(--bg-card);
            padding: 1.8rem;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--accent);
        }

        .service-box h3 {
            margin-bottom: 0.5rem;
            font-size: 1.15rem;
            color: var(--accent-hover);
        }

        .service-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* CTA Final */
        .cta-banner {
            background: linear-gradient(135deg, #1c2541, #111a36);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 3.5rem 2rem;
            text-align: center;
            margin-bottom: 4rem;
        }

        .cta-banner h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .cta-banner p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Botão Flutuante WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--whatsapp);
            color: #fff;
            padding: 0.9rem 1.3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
            z-index: 999;
